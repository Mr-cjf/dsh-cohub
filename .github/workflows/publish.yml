# 工作流文件：.github/workflows/publish.yml（与 npm 发布动作语义一致）
name: Publish to npm

on:
  push:
    tags:
      - 'v*'            # 推送 v* 标签时触发发布
  workflow_dispatch:    # 支持手动触发

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # 授予 OIDC 令牌，用于 npm provenance（可信发布）证明
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: npm ci

      - name: Publish
        run: npm publish --provenance --access public
